<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factura {{FOLIO}}</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @page {
      size: A4;
      margin: 0;
    }

    body {
      font-family: 'Arial', 'Helvetica', sans-serif;
      font-size: 11pt;
      line-height: 1.4;
      color: #000;
      background: #fff;
    }

    .page {
      width: 210mm;
      min-height: 297mm;
      padding: 15mm;
      margin: 0 auto;
      background: white;
      page-break-after: always;
      position: relative;
    }

    .page:last-child {
      page-break-after: auto;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #000;
    }

    .business-info {
      flex: 1;
      max-width: 60%;
    }

    .business-name {
      font-size: 18pt;
      font-weight: bold;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .business-details {
      font-size: 9pt;
      line-height: 1.5;
    }

    .logo-container {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Invoice Info */
    .invoice-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 10px;
      border: 1px solid #000;
    }

    .invoice-details, .customer-details {
      flex: 1;
    }

    .invoice-title {
      font-size: 16pt;
      font-weight: bold;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .info-row {
      display: flex;
      margin-bottom: 5px;
      font-size: 10pt;
    }

    .info-label {
      font-weight: bold;
      min-width: 100px;
    }

    .info-value {
      flex: 1;
    }

    /* Products Table */
    .products-section {
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 12pt;
      font-weight: bold;
      margin-bottom: 10px;
      text-transform: uppercase;
      border-bottom: 1px solid #000;
      padding-bottom: 5px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 15px;
    }

    th {
      background: #f0f0f0;
      border: 1px solid #000;
      padding: 8px;
      text-align: left;
      font-weight: bold;
      font-size: 10pt;
    }

    td {
      border: 1px solid #000;
      padding: 8px;
      font-size: 10pt;
    }

    .text-right {
      text-align: right;
    }

    .text-center {
      text-align: center;
    }

    /* Totals */
    .totals-section {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .totals-box {
      width: 300px;
      border: 1px solid #000;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid #ddd;
    }

    .total-row:last-child {
      border-bottom: none;
      background: #f0f0f0;
      font-weight: bold;
      font-size: 12pt;
    }

    .total-label {
      font-weight: bold;
    }

    /* Payments */
    .payments-section {
      margin-bottom: 20px;
    }

    /* Notes */
    .notes-section {
      margin-bottom: 20px;
      padding: 10px;
      border: 1px solid #ddd;
      min-height: 60px;
    }

    .notes-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    /* Footer */
    .footer {
      position: absolute;
      bottom: 15mm;
      left: 15mm;
      right: 15mm;
      padding-top: 15px;
      border-top: 1px solid #000;
      font-size: 9pt;
      text-align: center;
    }

    .signature-section {
      display: flex;
      justify-content: space-around;
      margin-top: 40px;
      margin-bottom: 20px;
    }

    .signature-box {
      text-align: center;
      width: 200px;
    }

    .signature-line {
      border-top: 1px solid #000;
      margin-bottom: 5px;
    }

    /* Status Badge */
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border: 1px solid #000;
      font-size: 9pt;
      font-weight: bold;
      text-transform: uppercase;
    }

    /* Print Styles */
    @media print {
      body {
        margin: 0;
        padding: 0;
      }
      
      .page {
        margin: 0;
        border: none;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  {{FACTURAS_HTML}}
</body>
</html>
